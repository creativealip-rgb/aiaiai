services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai3-app:latest
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_internal
      - edge

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai3_db}
      POSTGRES_USER: ${POSTGRES_USER:-ai3}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai3} -d ${POSTGRES_DB:-ai3_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_internal

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  app_internal:
    driver: bridge
  edge:
    driver: bridge

